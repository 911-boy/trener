<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=6.2">
</head>
<body>
<main id="screen"></main>

<nav class="tabs">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Сегодня</span></button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>План</span></button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M16 3c-2 1.5-2.5 4-2.5 7h2.5v11"/></svg><span>Еда</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V11M12 16V6M17 16v-3"/></svg><span>Прогресс</span></button>
  <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Профиль</span></button>
</nav>

<!-- экран упражнения -->
<section id="sheet" class="sheet" hidden></section>

<!-- таймер отдыха -->
<div id="rest" class="rest" hidden>
  <div class="rest-label">Отдых</div>
  <div class="rest-time" id="restTime">60</div>
  <div class="rest-btns">
    <button id="restPlus">+15 с</button>
    <button id="restSkip">Дальше</button>
  </div>
</div>

<!-- камера -->
<section id="cam" class="cam" hidden>
  <video id="camVideo" playsinline muted></video>
  <canvas id="camCanvas"></canvas>
  <div class="cam-top">
    <div class="cam-count" id="camCount">0</div>
    <div class="cam-mode" id="camMode"></div>
  </div>
  <div class="cam-hint" id="camHint">Загружаю нейросеть…</div>
  <div class="cam-btns">
    <button id="camFlip">Камера</button>
    <button id="camVoice">Голос: вкл</button>
    <button id="camSave">Записать</button>
    <button id="camClose">Закрыть</button>
  </div>
</section>

<!-- сканер штрихкода -->
<section id="scan" class="scan" hidden>
  <div id="scanView"></div>
  <p id="scanMsg"></p>
  <button class="btn" id="scanClose">Закрыть</button>
</section>

<div id="toast" class="toast" hidden></div>

<script src="data.js?v=6.2"></script>
<script src="data2.js?v=6.2"></script>
<script src="data3.js?v=6.2"></script>
<script src="figure.js?v=6.2"></script>
<script src="food.js?v=6.2"></script>
<script src="food2.js?v=6.2"></script>
<script src="app.js?v=6.2"></script>
<script type="module" src="pose.js?v=6.2"></script>
</body>
</html>
